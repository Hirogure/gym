 data-warm="${i}">準備セットを追加</button></div>${e.sets.map((s,j)=>`<div class="setblock ${s.done?'done':''} ${s.skipped?'skipped':''} ${j===e.sets.findIndex(x=>!x.done&&!x.skipped)?'current-set':''}">${s.skipped?'<p class="small">今回は見送り（未実施）</p>':''}<div class="row"><strong>${s.kind==='warmup'?'準備':'実施'} ${j+1}</strong><button class="check" data-check="${i},${j}" ${s.skipped?'disabled':''} aria-pressed="${s.done}" aria-label="${esc(e.name)} ${j+1}セット ${s.done?'完了を取り消す':'完了にする'}">${s.done?'✓ 完了':'○ 完了'}</button></div><div class="fieldgrid three"><label>重量 ${esc(e.config.unit)}<input type="number" inputmode="decimal" min="0" max="500" step="any" data-set="${i},${j},weight" value="${inputValue(s.weight)}" placeholder="未入力"></label><label>実際の回数<input type="number" inputmode="numeric" min="1" max="200" data-set="${i},${j},reps" value="${s.reps}"></label></div><button class="btn outline" data-copylast="${i},${j}" ${s.done||s.skipped?'disabled':''}>直前セットの重量・回数をコピー</button><details class="set-extra"><summary>詳細：RIR ${s.rir==null?'不明':esc(s.rir)} / 痛み ${s.pain==='no'?'なし':s.pain==='yes'?'あり':'未確認'} / フォーム ${s.form==='good'?'安定':s.form==='poor'?'崩れ':'未確認'}</summary><div class="fieldgrid"><label>RIR（任意）<input type="number" inputmode="decimal" min="0" max="10" step="0.5" data-set="${i},${j},rir" value="${inputValue(s.rir)}" placeholder="不明"></label></div><div class="fieldgrid"><label>痛み<select data-set="${i},${j},pain">${statusChoices(s.pain)}</select></label><label>フォーム<select data-set="${i},${j},form">${formChoices(s.form)}</select></label></div></details></div>`).join('')}${archive(e.definition||{d:'旧V6の下書き'})}</details>`;}
function legacyDraft(){const d=state.draft;$('today').innerHTML=`<h1>以前のV6下書き</h1><div class="card"><p>保存内容はそのまま保持しています。旧形式にはマシン設定・セット分類・RIRがないため、新しい増量判定には使いません。</p>${(d.exercises||[]).map(e=>`<p>${esc(e.name)}: ${(e.sets||[]).map(s=>`${esc(s.weight)} kg × ${esc(s.reps)}回 ${s.done?'✓':''}`).join(' / ')}</p>`).join('')}<button class="btn" id="archiveLegacy">旧下書きを履歴へ保管して新しく始める</button><button class="btn outline" id="legacyBack">戻る</button></div>`;$('legacyBack').onclick=home;$('archiveLegacy').onclick=()=>{const candidate=clone(state);candidate.history.unshift({...clone(d),date:new Date(d.started||Date.now()).toISOString(),source:'legacy-draft',legacy:true});candidate.draft=null;if(save(candidate))home();};}
function finish(){if(state.draft?.exercises?.some(e=>e.sets.some(s=>s.done&&(!Number.isFinite(s.weight)||s.weight<0||s.weight>500||!Number.isInteger(s.reps)||s.reps<1||s.reps>200)))){toast('完了セットの重量・回数が未入力または範囲外です。入力するか完了を取り消してください。');return;}const p=progress();if(!p.done){toast('完了したセットがありません。中断した下書きはそのまま保存できます。');return;}if(!confirm(`${p.done}セットを完了した記録として保存しますか？\n準備セットはワーキングセット集計から除きます。`))return;const candidate=clone(state),d=candidate.draft;candidate.history.unshift({...d,date:new Date().toISOString(),source:'production-entered',schemaVersion:2});candidate.draft=null;if(save(candidate)){undo=null;home();tab('history');toast('V6履歴へ保存しました。');}}
function records(){return state.history.filter(h=>!h.deleted&&h.schemaVersion===2&&h.source==='production-entered').flatMap(h=>(h.exercises||[]).filter(e=>!e.deleted).map(e=>{const all=(e.sets||[]).filter(s=>!s.deleted),pain=all.some(s=>s.pain==='yes')?'yes':all.every(s=>s.pain==='no')?'no':'unknown',form=all.some(s=>s.form==='poor')?'poor':all.every(s=>s.form==='good')?'good':'unknown';return{id:h.id+':'+(e.instanceId||e.exerciseId),date:h.date,exerciseId:e.exerciseId,exerciseName:e.name,config:clone(e.config),planKey:e.planKey,plan:clone(e.plan),pain,form,sets:all.map(s=>({...clone(s),load:s.weight,completed:s.done&&!s.skipped})),directMuscle:e.config.directMuscle||null};})).sort((a,b)=>new Date(b.date)-new Date(a.date));}
function history(){const all=records();$('history').innerHTML=`<div class="topline"><div><div class="eyebrow">V6 TRAINING LOG</div><h1>やった分だけ、残す。</h1><p class="muted">このブラウザで入力したV6実施記録です。旧raw履歴は別欄から閲覧できます。</p></div></div><p class="save-status" role="status"></p><div class="card">${state.history.length?state.history.map((h,i)=>`<div class="histitem"><div class="row"><h3>${date(h.date)} · ${esc(h.label||'旧V6')}</h3><button class="btn outline" data-edit="${i}">修正</button></div><p class="muted">${h.schemaVersion===2?`週${h.frequency} / Day ${esc(h.day)} / Phase ${h.phase}`:'旧形式: 分類・設定が不明なので新集計と増量判定から除外'}</p>${(h.exercises||[]).map(e=>`<p><strong>${esc(e.name)}</strong><br><span class="small">${(e.sets||[]).filter(s=>s.done).map(s=>`${s.kind==='warmup'?'準備 ':''}${esc(s.weight)} ${esc(e.config?.unit||'kg')} × ${esc(s.reps)}回${s.rir!=null?' / RIR '+s.rir:''}${s.pain==='yes'?' / 痛みあり':''}`).join(' · ')||'完了セットなし'}</span></p>`).join('')}</div>`).join(''):'<h3>まだ履歴がありません。</h3><p class="muted">最大重量やサンプルを実績として補いません。</p>'}</div>`;backupPanel();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editHistory(+b.dataset.edit));status();}
function editHistory(i){const original=state.history[i],candidate=clone(original);$('history').innerHTML=`<button class="back" id="cancelEdit">← 変更をやめる</button><h1>実施記録を修正</h1><p class="muted">新しい値で提案を再判定します。マシン設定は過去のまま保持します。</p><div class="card">${candidate.exercises.map((e,x)=>`<h3>${esc(e.name)}</h3>${e.sets.map((s,j)=>`<div class="history-set"><span>${j+1}組 ${s.kind==='warmup'?'準備':''}</span><label>重量<input type="number" data-editfield="${x},${j},weight" value="${inputValue(s.weight)}" min="0" max="500" step="any"></label><label>回数<input type="number" data-editfield="${x},${j},reps" value="${s.reps}" min="1" max="200"></label><label>RIR<input type="number" data-editfield="${x},${j},rir" value="${inputValue(s.rir)}" min="0" max="10" step="0.5"></label><label>痛み<select data-editfield="${x},${j},pain">${statusChoices(s.pain)}</select></label><label>フォーム<select data-editfield="${x},${j},form">${formChoices(s.form)}</select></label><label>完了<select data-editfield="${x},${j},done">${opt([['true','完了'],['false','未完了']],String(s.done===true))}</select></label></div>`).join('')}`).join('')}<button class="btn full" id="saveEdit">修正内容を保存</button><p class="save-status"></p></div>`;$('cancelEdit').onclick=history;$('saveEdit').onclick=()=>{for(const el of document.querySelectorAll('[data-editfield]')){const[x,j,k]=el.dataset.editfield.split(',');let v=el.value;if(['weight','reps','rir'].includes(k)){v=v===''?null:+v;if(k==='weight'&&v!==null&&(!Number.isFinite(v)||v<0||v>500)||k==='reps'&&(!Number.isInteger(v)||v<1||v>200)||k==='rir'&&v!==null&&(!Number.isFinite(v)||v<0||v>10)){toast('重量・回数・RIRの入力を確認してください。');return;}}if(k==='done')v=v==='true';candidate.exercises[x].sets[j][k]=v;if(k==='done'&&v===true)delete candidate.exercises[x].sets[j].skipped;}if(candidate.exercises.some(e=>e.sets.some(s=>s.done&&(!Number.isFinite(s.weight)||!Number.isInteger(s.reps)||s.reps<1)))){toast('完了セットの重量・回数を確認してください。');return;}const next=clone(state);next.history[i]=candidate;if(save(next)){history();toast('修正しました。次回提案は新しい内容で確認できます。');}};status();}
function growth(){const rs=records(),now=new Date(),week=W.week(now),sum=A.summarize(rs,{from:week.from,to:now.toISOString(),timeZone:'Asia/Tokyo'}),names=[...new Map(rs.map(s=>[JSON.stringify([s.exerciseName,s.config.machineId,s.config.setupId,s.config.unit,s.config.convention]),s])).keys()];if(!names.includes(selectedAdvice))selectedAdvice=names[0]||'';const latest=rs.find(s=>JSON.stringify([s.exerciseName,s.config.machineId,s.config.setupId,s.config.unit,s.config.convention])===selectedAdvice);$('growth').innerHTML=`<div class="topline"><div><div class="eyebrow">PERFORMANCE, NOT A PROMISE</div><h1>前回から、次回へ。</h1><p class="muted">記録された実施量とパフォーマンス。筋肉の増加量を測る画面ではありません。</p></div></div><div class="stats"><div class="stat"><div class="muted">今週・実施日（日本時間）</div><div class="big">${sum.trainingDays}日</div></div><div class="stat"><div class="muted">完了ワーキングセット</div><div class="big">${sum.workingSets}組</div></div><div class="stat"><div class="muted">筋群未分類</div><div class="big">${sum.unknownSets}組</div></div></div><p class="muted">準備・未完了・旧形式は含めません。未記録分は不明。複合種目の間接刺激を重ねて加算せず、筋群の割当が未確定の記録は未分類です。</p>${weekHTML()}<div class="card"><h2>自分で分類した主な部位</h2>${Object.entries(sum.direct).map(([name,n])=>`<div class="row"><span>${esc(name)}</span><strong>${n}組</strong></div>`).join('')||'<p class="muted">まだ部位が設定されていません。各マシン設定で任意に選べます。</p>'}<p class="muted">1セットを選択した主分類へ1回だけ加算。各筋肉への刺激量そのものではなく、間接刺激も加算しません。</p></div><div class="card"><h2>次回の相談カード</h2>${names.length?`<label>記録のある種目<select id="adviceName">${opt(names.map(n=>[n,JSON.parse(n).filter(Boolean).join(' / ')]),selectedAdvice)}</select></label><p class="muted">${esc(latest.config.machineId||'機種不明')} · ${esc(latest.config.setupId||'設定不明')} · ${esc(latest.config.convention||'表記不明')}</p><div id="readiness"></div><div id="advice"></div>`:'<p>比較できる記録がまだありません。今日の実施を記録すると、ここで振り返れます。</p>'}</div><details class="card"><summary>判定だけを試す（隔離された架空サンプル）</summary><p class="muted">実施履歴・次回計画には保存しません。</p><select id="sampleCase">${opt([['ready','50kgを3回記録・条件達成'],['countOnly','50kgを3回だけ・余力不明'],['reps','同重量で回数が改善'],['pain','今日は痛みあり'],['unknown','RIRが不明'],['machine','マシンが変更'],['fatigue','今日は疲労感あり']],sampleCase)}</select><div id="sampleAdvice"></div></details><details class="card"><summary>提案への選択履歴 (${state.decisions.length})</summary>${state.decisions.map(d=>`<p>${date(d.date)} · ${esc(d.proposal?.config?.exerciseName||'種目')} · ${{accept:'採用',keep:'維持',dismiss:'見送り'}[d.action]||esc(d.action)}</p>`).join('')||'<p>まだ選択履歴はありません。</p>'}</details>`;if(latest){$('adviceName').onchange=e=>{selectedAdvice=e.target.value;growth();};renderReadiness(latest);}$('sampleCase').onchange=e=>{sampleCase=e.target.value;renderSample();};renderSample();}
function readinessFor(name){const c=currentChecks[name];return c&&c.checkedDay===W.day(new Date())?c:{pain:'unknown',form:'unknown',recovery:'unknown'};}
function contextFor(latest){const c=clone(latest.config),future=state.futurePlans[latest.planKey],ws=A.workingSets(latest),base={...latest.plan,load:ws[0]?.load??null};const plan=future&&A.comparable(c,future.config)?clone(future.plan):base;const readiness={...readinessFor(latest.exerciseName)},draft=state.draft?.exercises?.find(e=>e.name===latest.exerciseName);if(draft?.sets?.some(s=>s.pain==='yes'))readiness.pain='yes';if(draft?.sets?.some(s=>s.form==='poor'))readiness.form='poor';return{config:c,plan,current:readiness,sessions:records(),decisions:state.decisions,now:new Date().toISOString(),timeZone:'Asia/Tokyo'};}
function renderReadiness(latest){const c=readinessFor(latest.exerciseName);$('readiness').innerHTML=`<p>今日の状態を確認（過去の記録とは別）</p><div class="fieldgrid three"><label>今日の痛み<select data-current="pain">${statusChoices(c.pain)}</select></label><label>今日のフォームの見通し<select data-current="form">${opt([['unknown','未確認'],['good','安定して行えそう'],['poor','安定させにくい']],c.form)}</select></label><label>回復感<select data-current="recovery">${opt([['unknown','未確認'],['normal','いつも通り'],['good','良好'],['poor','疲労感あり']],c.recovery)}</select></label></div>`;document.querySelectorAll('[data-current]').forEach(el=>el.onchange=()=>{currentChecks[latest.exerciseName]={...c,[el.dataset.current]:el.value,checkedDay:W.day(new Date())};renderReadiness(latest);});renderAdvice(latest);}
function adviceHTML(r,interactive){const p=r.proposal;return `<div class="note"><strong>${esc(r.message)}</strong>${p?`<p>${p.type==='load'?`${p.from} → ${p.to} ${esc(p.config.unit)} / 次回 ${p.targetReps}回を目安に全${p.planBefore.sets}組`:`${p.affectedSets.map(esc).join(', ')}: ${p.from} → ${p.to}回（重量${p.load} ${esc(p.config.unit)}を維持）`}</p>${p.type==='load'?`<p class="small">現在 ${p.from} ${esc(p.config.unit)} ＋ 確認済み刻み ${p.config.increment} = ${p.to}（${Math.round((p.to/p.from-1)*1000)/10}%増）。同重量を続けた回数だけでは判断しません。</p>`:''}<details><summary>この提案の理由</summary>${p.basis.map(b=>`<p>${date(b.date)}<br>${b.sets.map(s=>`${s.load}×${s.reps} / RIR${s.rir} / 痛みなし・フォーム安定`).join('<br>')}</p>`).join('')}</details>${interactive?'<div class="controls"><button class="btn" data-decision="accept">次回案に採用</button><button class="btn secondary" data-decision="keep">今の計画を維持</button><button class="btn outline" data-decision="dismiss">見送る</button></div>':''}`:''}<p class="small">${esc(r.limitations)}</p>${r.evidence.map((u,i)=>`<a target="_blank" rel="noopener" href="${u}">関連資料 ${i+1}</a> `).join('')}</div>`;}
function renderAdvice(latest){const context=contextFor(latest),r=A.evaluate(context);$('advice').innerHTML=adviceHTML(r,true);document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{try{const fresh=contextFor(latest),decision=A.decide({proposal:r.proposal,action:b.dataset.decision,plan:fresh.plan,context:fresh,decisions:state.decisions,date:new Date().toISOString()}),next=clone(state);next.decisions=decision.decisions;if(b.dataset.decision==='accept')next.futurePlans[latest.planKey]={plan:decision.plan,config:clone(fresh.config)};if(save(next)){growth();toast(b.dataset.decision==='accept'?'次回の準備に反映します。実施中の下書きと過去の記録は変更しません。':'今の計画を保持しました。');}}catch(e){toast('状況が変わりました。最新の記録・設定で再確認してください。');renderAdvice(latest);}});}
function renderSample(){const cfg={exerciseId:'sample:chest',exerciseName:'架空チェストプレス',machineId:'サンプル機A',setupId:'座席3',unit:'kg',convention:'stack',increment:2.5},plan={load:50,sets:3,repMin:8,repMax:12},current={pain:'no',form:'good',recovery:'normal'},now=new Date(),sessions=[2,5,8].map((ago,i)=>({id:'scenario-'+i,date:new Date(+now-ago*86400000).toISOString(),exerciseId:cfg.exerciseId,exerciseName:cfg.exerciseName,config:clone(cfg),pain:'no',form:'good',sets:[1,2,3].map(j=>({id:'work-'+j,kind:'working',completed:true,load:50,reps:12,rir:2,pain:'no',form:'good'}))}));if(sampleCase==='countOnly')sessions.forEach(s=>s.sets.forEach(x=>x.rir=null));if(sampleCase==='reps')sessions[0].sets.forEach(s=>s.reps=10);if(sampleCase==='pain')current.pain='yes';if(sampleCase==='unknown')sessions[0].sets[0].rir=null;if(sampleCase==='machine')cfg.machineId='別の機種';if(sampleCase==='fatigue')current.recovery='poor';$('sampleAdvice').innerHTML='<p>52.5kgは、確認済みの50kg＋器具の最小刻み2.5kg（5%増）の例です。3回来ただけでは増やしません。全予定セットの上限回数・余力・同一器具設定・今日の状態を確認し、採用は自分で選びます。</p>'+adviceHTML(A.evaluate({config:cfg,plan,current,sessions,now:now.toISOString(),timeZone:'Asia/Tokyo'}),false);}
function evidence(){$('evidence').innerHTML=`<div class="topline"><div><div class="eyebrow">WHAT COMES FROM WHERE</div><h1>根拠と、アプリの目安。</h1><p class="muted">資料確認: 2026年10月18日。一般的な健康な成人の研究が中心です。</p></div></div><div class="card"><h2>3つを混ぜません</h2><p>1. 原本メニュー: 54メニューの名前・順序・回数・セット・休憩を回収。原文は参考欄に保存しています。</p><p>2. 研究からの一般原則: 継続、回数や負荷の漸進、十分な休憩。最適量や回復には個人差があります。</p><p>3. アプリ独自の判定: 2日分・RIR2以上・30日以内・刻み10%以内は保守的な操作上の条件です。安全や筋肥大を保証する閾値ではありません。</p></div>${[
['継続・筋群への頻度と量','ACSM 2026は主要筋群を週2回以上、筋肥大には週約10セットを一般的目安として示します。これは成長の最低条件や個人の最適量ではありません。未達を埋める自動追加はしません。','https://pubmed.ncbi.nlm.nih.gov/41843416/'],
['重量が同じでも前進できる','8週間の比較試験では回数を増やす方法と負荷を増やす方法で多くの筋肥大指標が同程度でした。同重量3回を停滞・増量OKとは判断しません。','https://pubmed.ncbi.nlm.nih.gov/36199287/'],
['RIRと限界までの反復','8週間の大腿四頭筋の試験では1–2 RIRと限界反復で全体の筋肥大が似ていました。RIRは自己推定で、全種目に最適な数値が確定したわけではありません。','https://pubmed.ncbi.nlm.nih.gov/38393985/'],
['休憩は急がなくて大丈夫','訓練者21人・8週間の試験で1分と3分の休憩を比較。長い休憩が有利な指標もありましたが、全種目共通の唯一の正解ではありません。','https://pubmed.ncbi.nlm.nih.gov/26605807/'],

].map(([title,body,url])=>`<article class="card"><h2>${title}</h2><p>${body}</p><a target="_blank" rel="noopener" href="${url}">原資料を読む ↗</a></article>`).join('')}<div class="card"><h2>データの扱い</h2><p>保存先はこのブラウザのV6領域だけです。元HTMLや本番の保存キーには触れません。端末間同期はありません。旧V6記録は残しますが、未確認の設定・RIR・セット分類を推測で埋めません。</p><p>日数の集計・別日判定・表示は日本時間（Asia/Tokyo）。週は月曜0時〜翌月曜0時で、保存した元の時刻は変えません。準備・未完了・重複・削除済みのセットは実施量に含めません。種目の別名は自動統合しません。</p></div>`;}

<script>
/* Integrates the received V6 interface with explicit production migration. */
(() => {
'use strict';
const P=PowerBearStorage,main=document.querySelector('main'),nav=document.querySelector('.tabbar');
let initialized=loaded.ok&&!loaded.pendingInitialization,review=null,generation=0,lastFile=null,downloadBusy=false,activeReviewTarget=null;
const host=$('production-tools');
host.innerHTML='<div id="production-access"></div><div id="production-download" role="status" aria-live="polite"></div><button type="button" class="btn outline" id="production-share" hidden>共有シートで「ファイルに保存」</button>';
function setGate(){main.inert=!initialized||loadFailed;nav.inert=main.inert;}
function access(){
 setGate();
 if(loadFailed){$('production-access').innerHTML='<h2>保存データを保護しています</h2><p>既存の本番保存を読み取れないため、上書きを停止しています。元の gym_/pbm_ キーも変更しません。</p>';return;}
 $('production-access').innerHTML=initialized?
 '<p class="production-label">V6 · 本番用保存領域</p><p class="small">旧記録は元のキーとraw控えを保持しています。旧日誌・旧重量は実施完了が未確認なので、新しい増量判定には使いません。</p><button class="textbtn" id="scan-legacy">旧保存をもう一度確認する</button><div id="migration-preview"></div>':
 '<h1>旧記録を保持して引き継ぐ</h1><p>元の gym_/pbm_ キーを消さずに、V6専用領域へraw文字列の控えを保存します。デモ領域は読み込みません。</p><p>まず件数を確認してください。確認するまで保存・移行は実行しません。</p><button class="btn" id="scan-legacy">引継ぎプレビューを表示</button><div id="migration-preview" role="status"></div>';
 $('scan-legacy').onclick=()=>{
  try{review=P.previewMigration(storage,null,state);renderReview($('migration-preview'),review,'migration');}
  catch(e){$('migration-preview').textContent=e.message;}
 };
 if(!initialized){
  const restore=document.createElement('div');restore.innerHTML='<label>またはバックアップから復元内容を確認<input type="file" accept="application/json,.json" id="initialImportBackup"></label><div id="initialRestorePreview" role="status"></div>';$('production-access').appendChild(restore);bindImport($('initialImportBackup'),$('initialRestorePreview'));
 }
}
function bindImport(input,target){input.onchange=async ev=>{
 const gen=++generation,file=ev.target.files?.[0];target.textContent='';if(!file)return;
 if(file.size>P.MAX_FILE_BYTES){target.textContent='JSONは2MiB+4KiB以内にしてください。記録は変更していません。';return;}
 try{const text=await file.text();if(gen!==generation)return;const r=P.previewRestore(storage,text,state);if(gen!==generation)return;renderReview(target,r,'restore');}catch(e){if(gen===generation)target.textContent='復元を停止しました：'+e.message;}
};}
function summaryText(r){const s=r.summary;return r.kind==='migration'?
 `旧保存 ${s.keyCount}項目 / 日誌 ${s.logs}件（休養日 ${s.restDays}件） / 体調 ${s.conditions}件 / 重量履歴 ${s.weightHistoryKeys}項目 / 体重過去値 ${s.bodyweightEntries}件 / JSONとして読めない値 ${s.unreadableValues}件もrawのまま保持。${s.duplicate?'同一内容は引継ぎ済みのため、重複追加しません。':''}`:
 `現在のV6履歴 ${s.currentHistory}件 / 読込 ${s.importedHistory}件 / 統合後 ${s.mergedHistory}件 / 旧raw ${s.keyCount}項目（${s.legacySnapshots}個の控え） / 保持した別下書き ${s.retainedDrafts}件 / 読込側などの回復コピー ${s.retainedRecovery}件。復元前と読込側の回復データも保持し、上限超過なら記録を削らず停止します。`;
}
function renderReview(target,r,kind){
 if(activeReviewTarget&&activeReviewTarget!==target)activeReviewTarget.textContent='別の確認を開いたため、このプレビューは無効になりました。必要なら開き直してください。';
 activeReviewTarget=target;
 const gen=++generation;review=r;
 target.innerHTML='<h3>保存前の確認</h3><p class="review-summary">'+esc(summaryText(r))+'</p><p>旧キーは変更しません。回数がない値は不明のまま、休養日・体調・過去の体重も残します。旧重量を今日の推奨として入力しません。</p><label class="confirm-row"><input type="checkbox" id="production-consent"> 件数と保持方針を確認しました</label><div class="controls"><button type="button" class="btn" id="production-confirm" disabled>確認して'+(kind==='migration'?'引き継ぐ':'復元する')+'</button><button type="button" class="btn outline" id="production-cancel">やめる</button></div>';
 const consent=target.querySelector('#production-consent'),button=target.querySelector('#production-confirm');
 consent.onchange=()=>{button.disabled=!consent.checked;};
 target.querySelector('#production-cancel').onclick=()=>{generation++;review=null;activeReviewTarget=null;target.textContent='取り消しました。保存内容は変更していません。';};
 button.onclick=()=>{
  if(gen!==generation||!consent.checked)return;
  button.disabled=true;
  const result=P.commitReview(storage,r,state);
  if(!result.ok){button.disabled=false;toast(result.error);return;}
  generation++;review=null;activeReviewTarget=null;state=result.state;currentChecks={};undo=null;initialized=true;loadFailed=false;storageOk=true;
  access();home();if(kind==='restore')tab('history');
  toast(result.duplicate?'同じ旧記録は引継ぎ済みです。重複は作成していません。':'引継ぎ・復元を保存しました。元の旧キーはそのままです。');
 };
}
status=function(){document.querySelectorAll('.save-status').forEach(e=>{e.textContent=loadFailed?'既存保存の保護中：上書きできません。':!initialized?'初回引継ぎの確認待ちです。':storageOk?'このブラウザのV6本番領域に保存済み':'未保存です。この画面を閉じないでください。';e.classList.toggle('error',!storageOk||loadFailed);});};
const originalHome=home;
home=function(){originalHome();if(P.restartRequired(state.history,new Date())){
 const note=document.createElement('div');note.className='note restart-gate';note.textContent='再開時の状態は未確認です。新しい実施記録がない、または確認済みの実施から30日を超えています。以前の重量・次回案を自動入力せず、実際の器具表示と今日の体調を確認してください。';$('today').prepend(note);
}status();};
downloadBackup=function(text,name){
 if(downloadBusy)return;downloadBusy=true;$('production-share').disabled=true;setTimeout(()=>{downloadBusy=false;$('production-share').disabled=false;},1200);
 const output=$('production-download');lastFile=null;$('production-share').hidden=true;
 try{
  const blob=new Blob([text],{type:'application/json;charset=utf-8'});
  if(typeof File==='function'&&typeof navigator.canShare==='function'&&typeof navigator.share==='function'){
   try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[file]}))lastFile=file;}catch(e){}
  }
  $('production-share').hidden=!lastFile;
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.hidden=true;document.body.appendChild(link);
  try{link.click();}finally{link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  output.textContent='JSONのダウンロードを要求しました。保存・キャンセルの結果はこの画面では確認できません。「ファイル」アプリで確認してください。必要なら下の共有シートで「ファイルに保存」を選び、送信先のアプリ・連絡先は選ばないでください。';
 }catch(e){output.textContent='ダウンロードを開始できませんでした。共有ボタンがある場合は「ファイルに保存」を選べます。元の記録は変更していません。';}
};
$('production-share').onclick=async()=>{
 if(downloadBusy||!lastFile)return;downloadBusy=true;const button=$('production-share');button.disabled=true;
 try{await navigator.share({files:[lastFile]});$('production-download').textContent='共有操作が終了しました。保存完了は確認できません。「ファイル」アプリでJSONを確認してください。';}
 catch(e){$('production-download').textContent=e.name==='AbortError'?'共有シートを閉じました（キャンセルまたは保存先なし）。必要なら再試行してください。':'共有シートへファイルを渡せませんでした。元の記録は変更していません。';}
 finally{downloadBusy=false;button.disabled=false;}
};
backupPanel=function(){
 const section=document.createElement('div');section.className='card';section.innerHTML='<h2>V6のバックアップ・復元</h2><p>新しい実施記録と旧raw控えをJSONに保存します。元のPower Bearバックアップも読み込めます。デモの保存は対象外です。</p><div class="controls"><button class="btn" id="exportBackup">バックアップを保存</button><button class="btn outline" id="exportPreRestore">復元直前の控えを書き出す</button></div><label>JSONを選んで復元内容を確認<input type="file" accept="application/json,.json" id="importBackup"></label><div id="backupPreview" role="status"></div>';
 $('history').appendChild(section);
 const sizeNote=document.createElement('p');sizeNote.className='small';sizeNote.textContent='保存状態の上限は2MiB、JSONは2MiB+4KiBです。JSONはコンパクト形式で書き出します。統合後の上限超過や容量不足では停止し、記録を間引いたり現在の保存を上書きしたりしません。';section.prepend(sizeNote);
 $('exportBackup').onclick=()=>{try{downloadBackup(P.exportText(storage,state),'power-bear-v6-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json');}catch(e){toast(e.message);}};
 $('exportPreRestore').onclick=()=>{try{downloadBackup(P.exportPreRestore(storage),'power-bear-v6-before-restore.json');}catch(e){toast(e.message);}};
 try{
  const copies=P.recoveryView(storage);
  if(copies.length){const target=document.createElement('div');target.innerHTML='<p>読込側などから保持した回復コピー（現在の履歴とは別）</p><label>回復コピー<select id="recoveryCopy">'+copies.map(c=>'<option value="'+c.index+'">'+(c.index+1)+' · '+esc(c.createdAt||'日時不明')+' · '+c.bytes+' bytes</option>').join('')+'</select></label><button type="button" class="btn outline" id="exportRetainedRecovery">選んだ回復コピーを書き出す</button>';section.appendChild(target);
   $('exportRetainedRecovery').onclick=()=>{try{downloadBackup(P.exportPreRestore(storage,+$('recoveryCopy').value),'power-bear-v6-retained-recovery.json');}catch(e){toast(e.message);}};
  }
 }catch(e){toast(e.message);}
 bindImport($('importBackup'),$('backupPreview'));
};
const originalHistory=history;
history=function(){originalHistory();const section=document.createElement('div');section.className='card legacy-history';
 try{
  const snapshots=P.archiveView(storage);section.innerHTML='<h2>旧アプリの履歴・保存値</h2><p>各控えは元のraw文字列を保持しています。日誌の「完了」は未確認で、新しい実施量・増量の証拠に含めません。回数がない旧値は不明です。</p>'+(snapshots.length?snapshots.map((snap,i)=>'<details><summary>旧記録の控え '+(i+1)+' · '+Object.keys(snap.raw).length+'項目</summary><button class="btn outline" data-export-legacy="'+i+'">この旧raw控えを書き出す</button>'+Object.keys(snap.raw).sort().map(k=>{
   let label=k,pretty=snap.raw[k];try{const v=JSON.parse(pretty);pretty=JSON.stringify(v,null,2);if(k.startsWith('gym_log_'))label=(v?.isRest?'休養日':'旧日誌（実施完了は未確認）')+' '+k.slice(8);else if(k.startsWith('gym_cond_'))label='体調 '+k.slice(9);else if(k==='gym_bw')label='体重の過去値';else if(k.startsWith('gym_wh_'))label='旧重量履歴 '+k.slice(7)+'（当日推奨には使用しません）';}catch(e){label+='（JSONとして読めない値も保持）';}
   return '<details class="legacy-value"><summary>'+esc(label)+'</summary><p class="small">元キー：'+esc(k)+'</p><pre>'+esc(pretty)+'</pre></details>';
  }).join('')+'</details>').join(''):'<p>旧raw控えはありません。</p>');
  $('history').appendChild(section);document.querySelectorAll('[data-export-legacy]').forEach(b=>b.onclick=()=>{try{downloadBackup(P.exportOld(snapshots[+b.dataset.exportLegacy].raw),'power-bear-legacy-raw.json');}catch(e){toast(e.message);}});
 }catch(e){section.textContent=e.message;$('history').appendChild(section);}
};
window.addEventListener('storage',e=>{if(e.key===P.KEY){loadFailed=true;storageOk=false;setGate();$('production-access').textContent='別の画面で本番保存が変わりました。上書きを防ぐため停止しました。再読み込みしてください。';status();}});
access();home();
})();

 today.querySelectorAll('[data-check]').forEach(button=>{const original=button.onclick;button.onclick=()=>{const [i,j]=button.dataset.check.split(','),set=state.draft?.exercises?.[i]?.sets?.[j];if(set&&!set.done)for(const key of ['weight','reps']){const input=today.querySelector('[data-set="'+i+','+j+','+key+'"]');if(input)syncInput(input);}original?.();};});
 for(const id of ['back','finish']){const button=today.querySelector('#'+id);if(!button)continue;const original=button.onclick;button.onclick=()=>{today.querySelectorAll('[data-set]').forEach(syncInput);original?.();};}
};
home();
})();

</script></body></html>
