<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Power Bear V8</title>
<style>
:root{
  --navy:#1f9d63; --navy-d:#177a4c; --bg:#ffffff; --card:#fff; --ink:#1a2233;
  --sub:#5b6678; --line:#dde3ee; --ok:#1e9e62; --warn:#c77400;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5;}
main{max-width:640px; margin:0 auto; padding:14px 14px 110px;}
body.timer-on main{padding-bottom:180px;}
h1{font-size:1.12rem; margin:2px 0 10px; letter-spacing:.03em; color:var(--ink);}
h2{font-size:1rem; margin:0 0 8px;}
.card{background:var(--card); border:none; border-bottom:1px solid var(--line); border-radius:0;
  padding:16px 2px; margin-bottom:10px;}
.muted{color:var(--sub); font-size:.85rem;}
.small{font-size:.8rem;}
.btn{display:flex; align-items:center; justify-content:center; gap:6px; width:100%;
  min-height:54px; padding:12px 16px; border:none; border-radius:12px; cursor:pointer;
  background:var(--navy); color:#fff; font-size:1.05rem; font-weight:700;}
.btn:active{background:var(--navy-d);}
.btn.sub{background:#e7f6ee; color:var(--navy);}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600;}
.btn.danger{background:#fff; color:#b3261e; border:1px solid #e5b6b3; font-weight:600;}
.btn.sm{min-height:46px; font-size:.95rem;}
.btn:disabled{opacity:.45;}
.row{display:flex; gap:8px;}
.row>*{flex:1;}
.chips{display:flex; gap:8px; flex-wrap:wrap;}
.chip{flex:1 1 40%; min-height:50px; padding:10px 8px; border-radius:12px; border:1.5px solid var(--line);
  background:#fff; font-size:1rem; font-weight:700; cursor:pointer; text-align:center;}
.chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
.chip .sub2{display:block; font-size:.72rem; font-weight:500; opacity:.75; margin-top:2px;}
.seg{display:flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden;}
.seg button{flex:1; min-height:50px; border:none; background:#fff; font-size:1rem; font-weight:700; cursor:pointer; padding:8px 4px;}
.seg button.on{background:var(--navy); color:#fff;}
.seg button .sub2{display:block; font-size:.7rem; font-weight:500; opacity:.8;}
/* workout */
.ex{border:1px solid #e3e9f0; border-radius:16px; background:#fff; margin-bottom:12px; overflow:hidden; box-shadow:0 3px 10px rgba(23,43,60,.05);}
.ex-head{padding:12px 14px; cursor:pointer;}
.ex-head .nm{font-size:1.08rem; font-weight:800;}
.tag{display:inline-block; font-size:.7rem; font-weight:700; color:var(--navy); background:#e7f6ee;
  border-radius:999px; padding:2px 8px; margin-left:6px; vertical-align:2px;}
.ex-body{padding:0 14px 14px;}
.lastbar{background:#eef1f7; border-radius:10px; padding:8px 10px; font-size:.85rem; margin-bottom:10px;}
.lastbar b{color:var(--navy);}
.setrow{display:flex; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line);}
.setrow .no{width:1.4em; font-weight:800; color:var(--sub); text-align:center;}
.inp{display:flex; align-items:center; gap:4px;}
.inp button{width:40px; height:48px; border-radius:10px; border:1px solid var(--line); background:#f2f5fa;
  font-size:1.15rem; font-weight:800; cursor:pointer; color:var(--navy);}
.inp input{width:64px; height:48px; border:1.5px solid var(--line); border-radius:10px; text-align:center;
  font-size:1.1rem; font-weight:700; padding:0 2px;}
.inp .unit{font-size:.78rem; color:var(--sub); width:1.6em;}
.setrow.done{opacity:.75;}
.setrow .donebtn{flex:0 0 86px; min-height:52px; border:none; border-radius:12px; background:var(--navy);
  color:#fff; font-size:1rem; font-weight:800; cursor:pointer;}
.setrow .undobtn{flex:0 0 86px; min-height:52px; border-radius:12px; background:#e6f4ec; color:var(--ok);
  border:1px solid #bfe3cf; font-size:.95rem; font-weight:800; cursor:pointer;}
textarea.memo{width:100%; min-height:44px; border:1.5px solid var(--line); border-radius:10px; padding:9px 10px;
  font-size:1rem; font-family:inherit; resize:vertical; margin-top:6px;}
.subacts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.subacts button{flex:1 1 28%; min-height:44px; border-radius:10px; border:1px solid var(--line);
  background:#fff; font-size:.88rem; font-weight:600; cursor:pointer; color:var(--ink);}
select.subsel{width:100%; min-height:48px; border:1.5px solid var(--line); border-radius:10px; font-size:1rem; padding:0 10px; background:#fff;}
details{margin-top:10px;}
details summary{cursor:pointer; font-size:.9rem; font-weight:700; color:var(--navy); padding:6px 0;}
.formbox{font-size:.9rem; background:#f7f9fc; border-radius:10px; padding:10px 12px;}
.formbox li{margin:2px 0;}
/* nav + timer */
nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);}
nav .inner{max-width:640px; margin:0 auto; display:flex;}
nav button{flex:1; min-height:62px; border:none; background:none; font-size:.78rem; font-weight:700;
  color:var(--sub); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:5px 0;}
nav button .ic{display:flex; align-items:center; justify-content:center; width:44px; height:30px; border-radius:10px;}
nav button .ic svg{width:22px; height:22px;}
nav button.on{color:var(--ink);}
nav button.on .ic{background:#cdeea9;}
#timerbar{position:fixed; left:0; right:0; bottom:calc(62px + env(safe-area-inset-bottom)); z-index:41;
  display:none; background:var(--navy); color:#fff;}
body.timer-on #timerbar{display:block;}
#timerbar .inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:10px 14px;}
#timerbar .t{font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; min-width:4.2em;}
#timerbar button{min-height:48px; border-radius:10px; border:none; font-weight:800; cursor:pointer; padding:0 16px; font-size:.95rem;}
#timerbar .add{background:#33519e; color:#fff;}
#timerbar .end{background:#fff; color:var(--navy); margin-left:auto;}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:60; background:#222c44; color:#fff; padding:12px 18px; border-radius:999px; font-size:.92rem;
  font-weight:600; opacity:0; pointer-events:none; transition:opacity .25s; max-width:92vw; text-align:center;}
#toast.show{opacity:1;}
.hist-item{cursor:pointer;}
.cal-wrap{padding:14px 2px 6px; border-bottom:1px solid var(--line); margin-bottom:10px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.cal-head b{font-size:16px;}
.cal-nav{border:1px solid var(--line); background:#fff; width:34px; height:34px; border-radius:50%; font-size:18px; color:var(--ink); cursor:pointer;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-grid.dow{margin-bottom:2px;}
.cal-dow{text-align:center; font-size:11px; color:var(--gray); padding:2px 0;}
.cal-cell{position:relative; border:none; background:transparent; height:40px; border-radius:10px; font-size:14px; color:var(--ink); cursor:pointer; font-family:inherit;}
.cal-cell.on{background:#eef6f1; font-weight:800;}
.cal-dots{position:absolute; left:50%; bottom:4px; transform:translateX(-50%); display:flex; gap:2.5px;}
.cal-dots i{width:5px; height:5px; border-radius:50%;}
.cal-legend{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px;}
.cal-legend span{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--gray);}
.cal-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--navy);}
.cal-cell.sel{background:var(--navy); color:#fff;}
.cal-cell.sel .cal-dots i{box-shadow:0 0 0 1px rgba(255,255,255,.65);}
span.cal-cell{cursor:default;}
.hist-item .hd{display:flex; justify-content:space-between; align-items:baseline;}
.badge{font-size:.72rem; font-weight:700; border-radius:999px; padding:2px 9px; background:#e7f6ee; color:var(--navy);}
.badge.legacy{background:#f3e8d8; color:#8a5a12;}
table.week{width:100%; border-collapse:collapse; font-size:.92rem;}
table.week td, table.week th{padding:7px 4px; border-bottom:1px solid var(--line); text-align:left;}
.kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:.95rem;}
.kv:last-child{border-bottom:none;}
input[type="file"]{font-size:.9rem;}
.progress{height:10px; background:#e9f2ec; border-radius:999px; overflow:hidden; margin:8px 0 4px;}
.progress i{display:block; height:100%; background:var(--navy);}
.sheet{position:fixed; inset:0; z-index:70; background:rgba(15,20,35,.5); display:none; align-items:flex-end; justify-content:center;}
.sheet.open{display:flex;}
.sheet .box{background:#fff; width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;}
.num2{display:flex; gap:10px;}
.num2 label{flex:1; font-size:.85rem; color:var(--sub);}
.num2 input{width:100%; height:50px; border:1.5px solid var(--line); border-radius:10px; font-size:1.05rem; text-align:center; margin-top:4px;}

/* v8: recovery map + exercise add cards */
.bearwrap{display:flex; gap:8px; justify-content:center;}
.bearbox{flex:1; max-width:200px; text-align:center;}
.bearbox .cap{font-size:.78rem; color:var(--sub); font-weight:700; margin-top:2px;}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.8rem; color:var(--sub); margin:8px 0 2px;}
.legend i{display:inline-block; width:12px; height:12px; border-radius:4px; margin-right:4px; vertical-align:-1px;}
.recov-kv{display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:.92rem;}
.recov-kv:last-child{border-bottom:none;}
.dot{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px;}
.exgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
.excard{border:1.5px solid #e3e9f0; border-radius:16px; padding:12px; background:#fff; position:relative; min-height:118px; box-shadow:0 3px 10px rgba(23,43,60,.05);}
.excard .nm{font-size:1.02rem; font-weight:800; line-height:1.35;}
.excard .meta{font-size:.78rem; color:var(--sub); margin-top:3px;}
.excard .last{font-size:.76rem; color:var(--navy); margin-top:5px; padding-right:52px;}
.excard .addbtn{position:absolute; right:10px; bottom:10px; width:48px; height:48px; border-radius:50%; border:none; background:var(--ok); color:#fff; font-size:1.7rem; font-weight:800; cursor:pointer; line-height:1; box-shadow:0 2px 6px rgba(20,90,55,.35);}
.excard .addbtn:active{filter:brightness(.92);}
/* v9: story-style home layout */
.sec{border-bottom:1px solid var(--line); padding:14px 0 16px; margin-bottom:6px;}
.sec h2{font-size:1.12rem; margin:0 0 8px;}
.sec-head{display:flex; justify-content:space-between; align-items:center;}
.sec-head h2{margin:0;}
.banner{display:flex; justify-content:space-between; align-items:center; width:100%; border:none; border-radius:14px;
  padding:16px 18px; margin:12px 0 2px; background:linear-gradient(90deg,#a8d93e,#58c172); color:#17351f;
  font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:0 4px 12px rgba(90,160,60,.25);}
.rowline{display:flex; justify-content:space-between; align-items:center; padding:12px 0 0;}
.linkbtn{background:none; border:none; color:var(--ink); font-size:.95rem; font-weight:600; cursor:pointer; padding:6px 0;}
.list-row{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:none;
  padding:10px 0; font-size:1rem; cursor:pointer; color:var(--ink); text-align:left;}
.weekline{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:12px 0; border-bottom:1px solid var(--line);}
.bignum{font-size:1.35rem; font-weight:800;}
.lbl{font-size:.82rem; color:var(--sub); margin:10px 0 6px;}
.part-detail{display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0 2px;}
.pd-name{font-size:1.08rem; font-weight:800;}
.pd-status{font-size:1.08rem; font-weight:800;}
.legend2{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; font-size:.82rem; color:var(--sub); padding:10px 0 2px;}
.legend2 i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px;}
.info-btn{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); background:#fff; color:var(--sub); font-weight:700; cursor:pointer; flex:0 0 auto;}
.hist-row{display:flex; gap:12px; align-items:center; width:100%; background:none; border:none; border-bottom:1px solid var(--line);
  padding:12px 0; cursor:pointer; text-align:left; color:var(--ink);}
.hist-row:last-child{border-bottom:none;}
.hdate{font-size:1.02rem; color:var(--sub); min-width:3.1em;}
.hmain{flex:1; display:flex; flex-direction:column; min-width:0;}
.hmain .muted{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hsets{text-align:right; display:flex; flex-direction:column; line-height:1.15;}
.hsets b{font-size:1.3rem;}
.chev{color:var(--sub); font-size:1.25rem;}
.recov-row{padding:8px 0; border-bottom:1px solid var(--line);}
.recov-row:last-child{border-bottom:none;}
.recov-line{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.92rem;}
.recov-bar{height:6px; background:#edf0f4; border-radius:99px; overflow:hidden; margin-top:5px;}
.recov-bar i{display:block; height:100%; border-radius:99px;}
.bearphoto{position:relative; width:100%; max-width:300px; margin:0 auto;}
.bearphoto img{width:100%; display:block; border-radius:14px;}
.bearphoto svg{position:absolute; inset:0; width:100%; height:100%;}
</style>
</head>
<body>
<main id="app"></main>
<div id="timerbar"><div class="inner">
  <span class="t" id="timerText">2:00</span>
  <button class="add" id="timerAdd">+30秒</button>
  <button class="end" id="timerEnd">休憩を終える</button>
</div></div>
<nav><div class="inner">
  <button data-tab="today" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>ホーム</button>
  <button data-tab="history"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.2"/><path d="M3.5 4.5v4h4"/><path d="M12 8v4.5l3 2"/></svg></span>履歴</button>
  <button data-tab="review"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6"/><path d="M11 20V5"/><path d="M17 20v-9"/><path d="M3 20h18"/></svg></span>ふり返り</button>
  <button data-tab="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></span>設定</button>
</div></nav>
<div id="toast"></div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>
<script>
"use strict";
/* ===== メニュー定義（段階1=再開期の現行メニューが土台） ===== */
const MENUS = {
  upperA:{label:"上半身A", menus:{
    1:[["チェストプレス","マシン",2,"8–12"],["ラットプルダウン","マシン",2,"8–12"],["ショルダープレス","マシン",2,"8–12"],["アームカール","マシン",2,"10–15"]],
    2:[["スミスマシーンベンチプレス","スミス",3,"8–12"],["ラットプルダウン","マシン",3,"8–12"],["DBショルダープレス","ダンベル",2,"8–12"],["ケーブルカール","ケーブル",2,"10–15"]],
    3:[["スミスマシーンベンチプレス","スミス",3,"8–12"],["ケーブルロウ","ケーブル",3,"8–12"],["DBショルダープレス","ダンベル",3,"8–12"],["ハンマーカール","ダンベル",2,"10–15"]]}},
  lowerA:{label:"下半身A", menus:{
    1:[["レッグプレス","マシン",2,"10–15"],["レッグエクステンション","マシン",2,"10–15"],["レッグカール","マシン",2,"10–15"],["アブドミナルクランチ","マシン",2,"10–15"]],
    2:[["スミスマシーンスクワット","スミス",3,"8–12"],["レッグエクステンション","マシン",2,"10–15"],["レッグカール","マシン",2,"10–15"],["アブドミナルクランチ","マシン",2,"10–15"]],
    3:[["スミスマシーンスクワット","スミス",3,"8–12"],["DBRDL","ダンベル",3,"8–12"],["レッグエクステンション","マシン",2,"10–15"],["ケーブルクランチ","ケーブル",2,"10–15"]]}},
  upperB:{label:"上半身B", menus:{
    1:[["シーテッドロウ","マシン",2,"8–12"],["ペクトラル","マシン",2,"8–12"],["ケーブルフェイスプル","ケーブル",2,"10–15"],["ケーブルトライセプスプッシュダウン","ケーブル",2,"10–15"]],
    2:[["シーテッドロウ","マシン",3,"8–12"],["スミスマシーンインクラインプレス","スミス",3,"8–12"],["ケーブルフェイスプル","ケーブル",2,"10–15"],["ケーブルトライセプスプッシュダウン","ケーブル",2,"10–15"]],
    3:[["スミスマシーンインクラインプレス","スミス",3,"8–12"],["ラットプルダウン","マシン",3,"8–12"],["DBサイドレイズ","ダンベル",2,"10–15"],["DBオーバーヘッドトライセップスエクステンション","ダンベル",2,"10–15"]]}},
  lowerB:{label:"下半身B", menus:{
    1:[["グルート","マシン",2,"10–15"],["アブダクター","マシン",2,"10–15"],["カーフレイズ","マシン",2,"12–15"],["ケーブルクランチ","ケーブル",2,"10–15"]],
    2:[["レッグプレス","マシン",3,"10–15"],["スミスマシーンRDL","スミス",2,"8–12"],["グルート","マシン",2,"10–15"],["カーフレイズ","マシン",2,"12–15"]],
    3:[["スミスマシーンヒップスラスト","スミス",3,"8–12"],["レッグカール","マシン",3,"10–15"],["レッグプレス","マシン",2,"10–15"],["カーフレイズ","マシン",2,"12–15"]]}}
};
const ORDER = ["upperA","lowerA","upperB","lowerB"];
const STAGES = {1:"段階1 慣らし（マシン中心）",2:"段階2 移行（スミス・ダンベル併用）",3:"段階3 フリーウェイト中心"};
const CATALOG = ["チェストプレス","ラットプルダウン","ショルダープレス","アームカール","シーテッドロウ","ペクトラル","ケーブルフェイスプル","ケーブルトライセプスプッシュダウン","ケーブルカール","ケーブルロウ","ケーブルフライ","ケーブルハンマーカール","ケーブルオーバーヘッドトライセップスエクステンション","ケーブルキックバック","ケーブルラットプルダウン","スミスマシーンベンチプレス","スミスマシーンインクラインプレス","スミスマシーンオーバーヘッドプレス","スミスマシーンスクワット","スミスマシーンRDL","スミスマシーンローバーロウ","スミスマシーンヒップスラスト","DBショルダープレス","DBサイドレイズ","DBリアレイズ","DBシュラッグ","DBRDL","DBオーバーヘッドトライセップスエクステンション","ハンマーカール","レッグプレス","レッグエクステンション","レッグカール","ケーブルレッグカール","グルート","アブダクター","アダクター","カーフレイズ","アブドミナルクランチ","ケーブルクランチ","ローロー"];
function equipOf(name){ if(name.startsWith("スミス"))return"スミス"; if(name.startsWith("DB")||name==="ハンマーカール")return"ダンベル"; if(name.startsWith("ケーブル"))return"ケーブル"; return"マシン"; }
/* ===== V8: 部位マップ ===== */
const PARTS = [
  {id:"chest", label:"胸", hours:72},
  {id:"back", label:"背中", hours:72},
  {id:"shoulder", label:"肩", hours:48},
  {id:"biceps", label:"上腕二頭", hours:48},
  {id:"triceps", label:"上腕三頭", hours:48},
  {id:"abs", label:"腹", hours:48},

<script>
"use strict";
/* ===== 状態 ===== */
const KEY = "power_bear_v8";
let S = loadState();
let tab = "today";
let histMonth = null, histDay = null;
let inWorkout = false;
let openEx = 0;           // 展開中の種目のindex
let openHist = null;      // 履歴詳細を開いているid
let origProg = null;      // 従来メニューの選択（プログラム）
let origPhase = "1";      // 従来メニューのフェーズ
let lastAction = null;    // {ex,set} 直前の完了（戻す用）
let timerInt = null;

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && p.settings && Array.isArray(p.history)) return p; }
  }catch(e){}
  return { settings:{freq:4, stage:1, rest:120, lastExportAt:null}, history:[], draft:null };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("保存できませんでした。空き容量を確認してください"); } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(d){ d = d||new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fmtDay(iso){ if(!iso) return "----"; const d = new Date(iso.length<=10 ? iso+"T00:00:00" : iso); if(isNaN(d)) return iso; return (d.getMonth()+1)+"/"+d.getDate()+"（"+"日月火水木金土"[d.getDay()]+"）"; }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600); }
function openSheet(html){ document.getElementById("sheetBox").innerHTML = html; document.getElementById("sheet").classList.add("open"); }
function closeSheet(){ document.getElementById("sheet").classList.remove("open"); }
document.getElementById("sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") closeSheet(); });

/* ===== 前回記録 ===== */
function lastRecord(name){
  for(const h of S.history){
    if(!h.exercises) continue;
    for(const e of h.exercises){
      if(e.name === name && e.sets && e.sets.length){
        return { date:h.date, sets:e.sets, memo:e.memo||"", rir:(e.rir!=null? e.rir : ""), machine:e.machine||"" };
      }
    }
  }
  return null;
}
function setsText(sets){ return sets.map(s=>((s.kg||s.kg===0)? s.kg+"kg×" : "×") + (s.reps||"")).join(" · "); }

/* ===== ワークアウト開始 ===== */
function nextMenuId(){
  for(const h of S.history){ if(h.menuId && ORDER.includes(h.menuId)){ return ORDER[(ORDER.indexOf(h.menuId)+1)%ORDER.length]; } }
  return "upperA";
}
function menuSummary(menuId, stage){
  const list = MENUS[menuId].menus[stage];
  const sets = list.reduce((n,e)=>n+e[2],0);
  return { list, sets, minutes: Math.round(sets*2.6) };
}
function startWorkout(menuId){
  const stage = S.settings.stage;
  const { list } = menuSummary(menuId, stage);
  const exercises = list.map(([name, equip, nSets, reps])=>{
    const last = lastRecord(name);
    const sets = [];

    return { name, equip, reps, sets, memo:"", status:"active", substitutedFrom:null,
             rir:"", machine: last? (last.machine||"") : "",
             lastDate: last? last.date : null, lastSets: last? last.sets : null, lastMemo: last? last.memo : "",
             lastRir: last? last.rir : "", lastMachine: last? last.machine : "" };
  });
  S.draft = { id: uid(), menuId, menuLabel: MENUS[menuId].label, stage, startedAt: Date.now(), timerEnd: 0, exercises };
  lastAction = null; openEx = 0; inWorkout = true;
  save(); render();
  window.scrollTo(0,0);
}
function startOriginal(progKey, dayIdx, phase){
  const prog = ORIG[progKey]; if(!prog) return;
  const day = prog.days[dayIdx]; if(!day) return;
  const items = day.ph[phase] || day.ph["1"];
  const exercises = items.map(([name, nSets, reps, note])=>{
    const last = lastRecord(name);
    const sets = [];
    for(let i=0;i<nSets;i++){
      const ls = last && last.sets[Math.min(i, last.sets.length-1)];
      sets.push({ kg: ls? (ls.kg??"") : "", reps: ls? (ls.reps??"") : "", done:false });
    }
    return { name, equip: equipOf(name), reps: reps || "8–12", sets, memo:"", status:"active", substitutedFrom:null,
             rir:"", machine: last? (last.machine||"") : "", note: note||"",
             lastDate: last? last.date : null, lastSets: last? last.sets : null, lastMemo: last? last.memo : "",
             lastRir: last? last.rir : "", lastMachine: last? last.machine : "" };
  });
  S.draft = { id: uid(), menuId: null, menuLabel: day.lbl + "（原本・" + prog.name + " フェーズ" + phase + "）",
    stage: S.settings.stage, startedAt: Date.now(), timerEnd: 0, exercises };
  lastAction = null; openEx = 0; inWorkout = true;
  save(); render(); window.scrollTo(0,0);
}
function draftProgress(){
  const d = S.draft; if(!d) return {done:0,total:0};
  let done=0,total=0;
  for(const e of d.exercises){ if(e.status==="skipped") continue; for(const s of e.sets){ total++; if(s.done) done++; } }
  return {done,total};
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const app = document.getElementById("app");
  if(inWorkout && S.draft){ app.innerHTML = viewWorkout(); }
  else if(tab==="today"){ app.innerHTML = viewToday(); }
  else if(tab==="history"){ app.innerHTML = viewHistory(); }
  else if(tab==="review"){ app.innerHTML = viewReview(); }
  else if(tab==="settings"){ app.innerHTML = viewSettings(); }
  updateTimerBar();
}

/* ===== V8: 回復マップ ===== */
function partRecovery(){
  const now = Date.now();
  const lastAt = {};
  for(const s of S.history){
    const t = s.finishedAt || s.startedAt || (s.date? Date.parse(s.date+"T00:00:00") : 0);
    if(!t) continue;
    for(const e of (s.exercises||[])){
      const p = partOf(e.name);
      if(p && (!lastAt[p] || t > lastAt[p].t)) lastAt[p] = { t:t, date:s.date };
    }
  }
  const out = {};
  for(const p of PARTS){
    const L = lastAt[p.id];
    if(!L){ out[p.id] = { state:"none", pct:0, remain:0, date:null }; continue; }
    const elapsedH = (now - L.t)/36e5;
    const pct = Math.max(0, Math.min(100, Math.round(elapsedH/p.hours*100)));
    out[p.id] = pct>=100
      ? { state:"done", pct:100, remain:0, date:L.date }
      : { state:"recovering", pct:pct, remain:Math.max(1, Math.ceil(p.hours - elapsedH)), date:L.date };
  }
  return out;
}

function bearSVG(view, rec){
  const F = function(id){ return recovColor(rec[id]? rec[id].state : "none"); };
  let o = "";
  const regs = BEAR_REGIONS[view] || {};
  for(const id in regs){
    for(const e of regs[id]){
      o += '<ellipse cx="'+Math.round(e[0]*1000)+'" cy="'+Math.round(e[1]*2000)+'" rx="'+Math.round(e[2]*1000)+'" ry="'+Math.round(e[3]*2000)+'" fill="'+F(id)+'" fill-opacity="0.47"/>';
    }
  }
  const img = view==="front"? BEAR_FRONT_IMG : BEAR_BACK_IMG;
  return '<div class="bearphoto" role="img" aria-label="bear-'+view+'"><img src="'+img+'" alt=""><svg viewBox="0 0 1000 2000" preserveAspectRatio="none" aria-hidden="true">'+o+'</svg></div>';
}
let selPart = null;
let selPartTouched = false;
let recListOpen = false;
let nextExOpen = false;
const MUSCLE = { chest:"大胸筋", back:"広背筋など", shoulder:"三角筋", biceps:"上腕二頭筋", triceps:"上腕三頭筋", abs:"腹直筋", quads:"大腿四頭筋", glutes:"大臀筋", hams:"ハムストリングス", calves:"腓腹筋" };
const MUSCLE_SUB = { chest:"大胸筋", back:"肩甲骨まわり・広背筋・腰まわり", shoulder:"三角筋（前部・中部・後部）", biceps:"上腕二頭筋", triceps:"上腕三頭筋", abs:"腹直筋・腹斜筋", quads:"大腿四頭筋", glutes:"大臀筋・中臀筋", hams:"ハムストリングス（太もも裏）", calves:"腓腹筋・ヒラメ筋" };
function statusText(r){ return r.state==="done"? "回復完了" : r.state==="recovering"? "回復中" : "未記録"; }
function statusDetail(r){ return r.state==="done"? "100%" : r.state==="recovering"? "あと約"+r.remain+"時間" : "記録なし"; }
function statusColor(r){ return r.state==="done"? "#1e9e62" : r.state==="recovering"? "#dd8a00" : "#9aa7b5"; }
function defaultSelPart(rec){
  for(const p of PARTS){ if(rec[p.id].state==="recovering") return p.id; }
  for(const p of PARTS){ if(rec[p.id].state==="done") return p.id; }
  return "chest";
}
function setSelPart(v){ selPart = v; selPartTouched = true; render(); }
function toggleRecList(){ recListOpen = !recListOpen; render(); }
function toggleNextEx(){ nextExOpen = !nextExOpen; render(); }
function recRowsHTML(rec){
  let h = "";
  for(const p of PARTS){
    const r = rec[p.id];
    const txt = r.state==="done"? "回復完了 100%" : r.state==="recovering"? "回復中 あと約"+r.remain+"時間（"+r.pct+"%）" : "未記録";
    h += '<div class="recov-row"><div class="recov-line"><span><span class="dot" style="background:'+recovColor(r.state)+'"></span>'+p.label+'</span><span>'+txt+(r.date? ' <span class="muted small">'+fmtDay(r.date)+"</span>" : "")+'</span></div>'
      + '<div class="recov-bar"><i style="width:'+r.pct+'%;background:'+recovColor(r.state)+'"></i></div></div>';
  }
  return h;
}
function openRecovInfo(){
  openSheet("<h2>回復の目安について</h2><p class='muted'>各部位を最後に鍛えてからの経過時間で計算しています。目安の回復時間は、大きな部位（胸・背中・太もも・臀部）が72時間、小さな部位（肩・腕・腹・ふくらはぎ）が48時間です。あくまで目安なので、痛みや疲労が残っているときは無理をしないでください。</p><button class='btn ghost' onclick='closeSheet()'>閉じる</button>");
}
function openBearSheet(){
  const rec = partRecovery();
  openSheet("<h2>部位別コンディション</h2>"
    + '<div class="bearwrap"><div class="bearbox">'+bearSVG("front", rec)+'<div class="cap">前面</div></div><div class="bearbox">'+bearSVG("back", rec)+'<div class="cap">背面</div></div></div>'
    + recRowsHTML(rec)
    + "<button class='btn ghost' style='margin-top:10px' onclick='closeSheet()'>閉じる</button>");
}
function openMenuSheet(){
  let h = "<h2>メニューを選ぶ</h2><p class='muted small'>選ぶと、そのまま記録を始めます。</p>";
  for(const id of ORDER){
    const s2 = menuSummary(id, S.settings.stage);
    h += '<button class="btn sub" style="margin-top:8px" onclick="closeSheet();startWorkout(\''+id+'\')">'+esc(MENUS[id].label)+'（'+s2.list.length+'種目 · '+s2.sets+'セット）</button>';
  }
  h += "<button class='btn ghost' style='margin-top:10px' onclick='closeSheet()'>閉じる</button>";
  openSheet(h);
}
function viewRecoverySection(){
  const rec = partRecovery();
  if(!selPart || !rec[selPart]) selPart = defaultSelPart(rec);
  else if(!selPartTouched && rec[selPart].state==="none"){ const d0 = defaultSelPart(rec); if(rec[d0].state!=="none") selPart = d0; }
  let nRec = 0, nDone = 0, nNone = 0;
  for(const p of PARTS){ const s = rec[p.id].state; if(s==="recovering") nRec++; else if(s==="done") nDone++; else nNone++; }
  const sel = PARTS.find(function(p){ return p.id===selPart; });
  const sr = rec[selPart];
  let h = '<div class="sec">';
  h += '<div class="sec-head"><h2>部位別コンディション</h2><button class="info-btn" onclick="openRecovInfo()" aria-label="回復の目安について">i</button></div>';
  h += '<p class="muted small" style="margin:2px 0 4px">トレーニング記録から計算した回復の目安</p>';
  h += '<div class="bearwrap"><div class="bearbox">'+bearSVG("front", rec)+'<div class="cap">前面</div></div><div class="bearbox">'+bearSVG("back", rec)+'<div class="cap">背面</div></div></div>';
  h += '<p class="lbl">部位を確認</p>';
  h += '<div style="display:flex;gap:8px;align-items:stretch"><select class="subsel" style="flex:1" onchange="setSelPart(this.value)">'
    + PARTS.map(function(p){ return '<option value="'+p.id+'"'+(p.id===selPart?" selected":"")+">"+p.label+"（"+MUSCLE[p.id]+"）</option>"; }).join("")
    + '</select><button class="btn ghost sm" style="flex:0 0 92px;min-height:48px" onclick="openBearSheet()">拡大 ↗</button></div>';
  h += '<div class="part-detail"><div><div class="pd-name">'+sel.label+'</div><div class="muted small">'+MUSCLE_SUB[sel.id]+'</div></div>'
    + '<div style="text-align:right"><div class="pd-status" style="color:'+statusColor(sr)+'">'+statusText(sr)+'</div><div class="muted small">'+statusDetail(sr)+(sr.date? " · 前回 "+fmtDay(sr.date) : "")+'</div></div></div>';
  h += '<div class="legend2"><span><i style="background:#f5a623"></i>回復中 '+nRec+'</span><span><i style="background:#2fbf71"></i>回復完了 '+nDone+'</span><span><i style="background:#b9c6d4"></i>未記録 '+nNone+'</span></div>';
  h += '<button class="list-row" onclick="toggleRecList()"><span>部位ごとの回復状況</span><span class="muted">'+PARTS.length+'部位 <b>'+(recListOpen?"−":"＋")+'</b></span></button>';
  if(recListOpen) h += recRowsHTML(rec);
  h += "</div>";
  return h;
}

    h += '<div class="sec" style="border-bottom:none;padding-bottom:2px"><button class="list-row" onclick="toggleNextEx()"><span style="font-weight:800;font-size:1.05rem">今回の種目</span><span class="muted">'+sum.list.length+'種目 <b>'+(nextExOpen?"∧":"∨")+'</b></span></button>';
    if(nextExOpen){
      for(const e of sum.list){
        h += '<div class="recov-line" style="padding:5px 0"><span>'+esc(e[0])+'<span class="tag">'+esc(partLabel(partOf(e[0])) || "")+'</span></span><span class="muted small">'+e[2]+'セット × '+esc(e[3])+'回</span></div>';
      }
    }
    h += '<p class="muted small" style="margin:6px 0 0">次は '+esc(MENUS[nid].label)+' · '+sum.list.length+'種目 · '+sum.sets+'セット · 筋トレ目安 約'+sum.minutes+'分</p></div>';
  }
  const wk = weekSessions();
  h += '<div class="weekline"><span>今週 <b class="bignum">'+wk.length+" / "+st.freq+'日</b></span><span class="muted">'+wk.length+'回のトレーニング</span><button class="linkbtn" onclick="goTab(\'settings\')">目標設定</button></div>';
  h += viewRecoverySection();
  if(!S.draft){
    const prog = ORIG[origProg];
    h += '<div class="sec"><h2>'+esc(prog.name)+'・フェーズ'+origPhase+' のメニュー</h2><p class="muted small">従来プログラム（V6原本）です。上の「プログラムを選ぶ」で選んだ内容を表示しています。ここからも記録を始められます。</p><div class="chips">';
    prog.days.forEach(function(day, di){
      const items = day.ph[origPhase] || day.ph["1"];
      const sets = items.reduce(function(n,it){ return n+it[1]; },0);
      h += '<button class="chip" onclick="startOriginal(\''+origProg+'\','+di+',\''+origPhase+'\')">'+esc(day.lbl)+'<span class="sub2">'+items.length+'種目 · '+sets+'セット</span></button>';
    });
    h += "</div></div>";
    h += '<div class="sec"><h2>再開期メニュー</h2><p class="muted small">いまの段階（'+esc(STAGES[st.stage])+'）に合わせた軽めのメニューです。上の従来プログラムとは別の内容で、各種目少なめの構成になっています。</p><div class="chips">';
    for(const id of ORDER){
      const s2 = menuSummary(id, st.stage);
      h += '<button class="chip" onclick="startWorkout(\''+id+'\')">'+esc(MENUS[id].label)+'<span class="sub2">'+s2.list.length+'種目 · '+s2.sets+'セット</span></button>';
    }
    h += "</div></div>";
  }
  if(S.history.length){
    h += '<div class="sec"><div class="sec-head"><h2>最近の記録</h2><button class="linkbtn" onclick="goTab(\'history\')">すべて →</button></div>';
    for(const s of S.history.slice(0,3)){
      const totalSets = (s.exercises||[]).reduce(function(n,e){ return n+(e.sets? e.sets.length:0); },0);
      const names = (s.exercises||[]).map(function(e){ return e.name; }).join("・");
      h += '<button class="hist-row" onclick="goTab(\'history\')"><span class="hdate">'+fmtMD(s.date)+'</span><span class="hmain"><b>'+esc(s.menuLabel||"トレーニング")+'</b><span class="muted small">'+esc(names)+'</span></span><span class="hsets"><b>'+totalSets+'</b><span class="muted small">本セット</span></span><span class="chev">›</span></button>';
    }
    h += "</div>";
  }
  if(S.history.length>=3 && (!st.lastExportAt || Date.now()-new Date(st.lastExportAt).getTime() > 30*864e5)){
    h += '<div class="sec"><h2>バックアップのお願い</h2><p class="muted">記録はこの端末の中だけに保存されています。機種変更や故障で消えないよう、ときどきバックアップを保存してください。</p>'
      + '<button class="btn sub sm" onclick="goTab(\'settings\')">設定でバックアップする</button></div>';
  }
  return h;
}
function goTab(t){ tab = t; inWorkout = false; render(); window.scrollTo(0,0); }
function setOrigProg(k){ origProg = k; if(S.settings.freq !== Number(k)){ S.settings.freq = Number(k); save(); } render(); }
function setOrigPhase(p){ origPhase = p; render(); }
function resumeWorkout(){ inWorkout = true; render(); window.scrollTo(0,0); }
function confirmDiscard(){
  openSheet("<h2>下書きを破棄しますか</h2><p class='muted'>入力中の記録は消えます。元に戻せません。</p>"
    + '<button class="btn danger" onclick="doDiscard()">破棄する</button>'
    + '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">やめる</button>');
}
function doDiscard(){ S.draft = null; inWorkout = false; lastAction = null; stopTimer(); save(); closeSheet(); render(); toast("下書きを破棄しました"); }

/* ===== 記録画面 ===== */

/* ===== V8: 種目追加カード ===== */
let addPanelOpen = false;
let addFilter = "all";
const PART_GROUPS = [ ["all","すべて"], ["chest","胸"], ["back","背中"], ["shoulder","肩"], ["arm","腕"], ["leg","脚"], ["glutes","お尻"], ["abs","腹"] ];
function partGroupOf(pid){
  if(pid==="biceps" || pid==="triceps") return "arm";
  if(pid==="quads" || pid==="hams" || pid==="calves") return "leg";
  return pid;
}
function toggleAddPanel(){ addPanelOpen = !addPanelOpen; render(); }
function setAddFilter(f){ addFilter = f; render(); }
function addExercise(name){
  if(!S.draft) return;
  const last = lastRecord(name);
  const nSets = (last && last.sets.length)? last.sets.length : 3;
  const sets = [];
  for(let i=0;i<nSets;i++){
    const ls = last && last.sets[Math.min(i, last.sets.length-1)];
    sets.push({ kg: ls? (ls.kg??"") : "", reps: ls? (ls.reps??"") : "", done:false });
  }
  S.draft.exercises.push({ name:name, equip: equipOf(name), reps: defaultRepsFor(name), sets:sets, memo:"", status:"active", substitutedFrom:null,
    rir:"", machine: last? (last.machine||"") : "",
    lastDate: last? last.date : null, lastSets: last? last.sets : null, lastMemo: last? last.memo : "",
    lastRir: last? last.rir : "", lastMachine: last? last.machine : "" });
  openEx = S.draft.exercises.length - 1;
  addPanelOpen = false;
  save(); render();
  toast(name+" を追加しました");
}
function viewAddPanel(){
  const inDraft = new Set(S.draft.exercises.map(function(e){ return e.name; }));
  let h = '<button class="btn sub" style="margin:12px 0" onclick="toggleAddPanel()">'+(addPanelOpen? "種目リストを閉じる" : "＋ 種目を追加")+"</button>";
  if(!addPanelOpen) return h;
  h += '<div class="chips" style="margin-bottom:4px">';
  for(const g of PART_GROUPS){
    h += '<button class="chip'+(addFilter===g[0]?" on":"")+'" style="flex:1 1 22%; min-height:44px" onclick="setAddFilter(\''+g[0]+'\')">'+g[1]+"</button>";
  }
  h += '</div><div class="exgrid">';
  let shown = 0;
  for(const name of CATALOG){
    if(inDraft.has(name)) continue;
    const pid = partOf(name);
    if(addFilter!=="all" && partGroupOf(pid)!==addFilter) continue;
    shown++;
    const last = lastRecord(name);
    h += '<div class="excard"><div class="nm">'+esc(name)+'</div>'
      + '<div class="meta">'+esc(partLabel(pid)||"")+" · "+esc(equipOf(name))+"</div>"
      + (last? '<div class="last">前回 '+fmtDay(last.date)+"："+esc(setsText(last.sets))+"</div>" : '<div class="last">前回の記録なし</div>')
      + '<button class="addbtn" aria-label="'+esc(name)+'を追加" onclick="addExercise(\''+esc(name)+'\')">＋</button></div>';
  }
  if(!shown) h += '<p class="muted">この部位の種目はすべて追加済みです。</p>';
  h += "</div>";
  return h;
}

function viewWorkout(){
  const d = S.draft, p = draftProgress();
  const mins = Math.max(0, Math.round((Date.now()-d.startedAt)/60000));
  let h = '<button class="btn ghost sm" style="margin-bottom:10px" onclick="backToToday()">← ホームへ（下書きは保持されます）</button>';
  h += "<h1>"+esc(d.menuLabel || MENUS[d.menuId].label)+(d.menuId? " · "+esc(STAGES[d.stage]) : "")+"</h1>";
  h += '<div class="card" style="padding:10px 14px"><div class="kv"><span>進捗</span><b>完了 '+p.done+" / "+p.total+' セット</b></div>'
    + '<div class="progress"><i style="width:'+(p.total? Math.round(p.done/p.total*100):0)+'%"></i></div>'
    + '<div class="kv"><span>経過</span><span>'+mins+' 分</span></div>'
    + (lastAction? '<button class="btn ghost sm" onclick="undoLast()">直前の完了を戻す</button>' : "")
    + "</div>";
  d.exercises.forEach((e, i)=>{ h += exCard(e, i); });
  h += viewAddPanel();
  const allDone = p.total>0 && p.done===p.total;
  h += '<button class="btn" '+(p.done===0?"disabled":"")+' onclick="openFinish()">'+(allDone? "完了して記録する" : "できた分で終了する")+"</button>";
  if(p.done===0) h += '<p class="muted small">1セットでも完了すると、終了して履歴に残せます。</p>';
  h += '<button class="btn ghost sm" style="margin-top:14px" onclick="confirmDiscard()">このトレーニングを破棄する</button>';
  return h;
}
function backToToday(){ inWorkout = false; tab = "today"; render(); window.scrollTo(0,0); }

function exCard(e, i){
  const skipped = e.status==="skipped";
  const doneSets = e.sets.filter(s=>s.done).length;
  let h = '<div class="ex" id="ex'+i+'">';
  h += '<div class="ex-head" onclick="toggleEx('+i+')"><span class="nm">'+(i+1)+". "+esc(e.name)+'</span><span class="tag">'+esc(e.equip)+"</span>"
    + '<div class="muted small">'+e.sets.length+"セット × "+esc(e.reps)+"回"
    + (skipped? ' · <b style="color:var(--warn)">見送り</b>' : " · 完了 "+doneSets+"/"+e.sets.length)
    + (e.substitutedFrom? " · 代替（元："+esc(e.substitutedFrom)+"）" : "")+"</div></div>";
  if(openEx !== i || skipped){
    if(skipped){
      h += '<div class="ex-body"><button class="btn ghost sm" onclick="unskipEx('+i+')">見送りを取り消す</button></div>';
    }
    return h + "</div>";
  }
  h += '<div class="ex-body">';
  if(e.lastSets){
    h += '<div class="lastbar">前回 '+fmtDay(e.lastDate)+"： <b>"+esc(setsText(e.lastSets))+"</b>"
      + (e.lastMemo? "<br>メモ： "+esc(e.lastMemo) : "")
      + (e.lastMachine? "<br>マシンの設定： "+esc(e.lastMachine) : "")
      + (e.lastRir!=="" && e.lastRir!=null? "<br>余力： あと"+esc(e.lastRir)+"回" : "")
      + '<br><button class="btn sub sm" style="margin-top:6px" onclick="fillFromLast('+i+')">前回の値を使う</button></div>';
  } else {
    h += '<div class="lastbar">前回の記録はまだありません。</div>';
  }
  if(e.note) h += '<p class="muted small" style="margin:0 0 6px">※ '+esc(e.note)+"（ウォームアップを1セット入れてください）</p>";
  e.sets.forEach((s, j)=>{
    if(s.done){
      h += '<div class="setrow done"><span class="no">'+(j+1)+'</span><span style="flex:1;font-weight:700">'+(s.kg===""?"自重":s.kg+" kg")+" × "+s.reps+' 回 ✓</span>'
        + '<button class="undobtn" onclick="undoSet('+i+","+j+')">戻す</button></div>';
    } else {
      const oc = `onclick="stepVal(${i},${j},'kg',-1)"`;
      const oc2 = `onclick="stepVal(${i},${j},'kg',1)"`;
      const oc3 = `onclick="stepVal(${i},${j},'reps',-1)"`;
      const oc4 = `onclick="stepVal(${i},${j},'reps',1)"`;
      h += `<div class="setrow"><span class="no">${j+1}</span>`
        + `<span class="inp"><button ${oc}>−</button>`
        + `<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="重量" value="${esc(s.kg)}" onchange="setVal(${i},${j},'kg',this.value)">`
        + `<button ${oc2}>＋</button><span class="unit">kg</span></span>`
        + `<span class="inp"><button ${oc3}>−</button>`
        + `<input type="number" inputmode="numeric" step="1" min="0" placeholder="回数" value="${esc(s.reps)}" onchange="setVal(${i},${j},'reps',this.value)">`
        + `<button ${oc4}>＋</button><span class="unit">回</span></span>`
        + `<button class="donebtn" onclick="completeSet(${i},${j})">完了</button></div>`;
    }
  });
  h += '<div class="subacts" style="margin-top:4px">'
    + '<button onclick="addSet('+i+')">＋ セットを追加</button>'
    + '<button onclick="removeSet('+i+')">最後のセットを削除</button></div>';
  h += '<label class="small muted">この種目のメモ（自動保存）</label>'
    + '<textarea class="memo" placeholder="フォームやマシンの位置など、あとで見返したいこと" oninput="setMemo('+i+',this.value)">'+esc(e.memo)+"</textarea>";
  h += '<details><summary>体調・器具の詳細（任意）</summary><div class="formbox">'
    + '<label class="small muted">余力（最後のセットで、あと何回できそうだったか）</label>'
    + '<select class="subsel" onchange="setRir('+i+',this.value)"><option value="">未入力</option>'
    + ["0","1","2","3","4+"].map(v=>'<option value="'+v+'"'+(String(e.rir)===v?" selected":"")+">あと"+v+"回</option>").join("") + "</select>"
    + '<label class="small muted" style="display:block;margin-top:8px">マシンの設定（シート位置・グリップ位置など。次回そのまま表示されます）</label>'
    + '<input type="text" class="subsel" placeholder="例：シート位置3、グリップ内側" value="'+esc(e.machine||"")+'" onchange="setMachine('+i+',this.value)">'
    + '<p class="muted small">痛みがある場合は無理をせず、その種目は見送ってください。</p></div></details>';
  const f = (typeof FORM!=="undefined") ? FORM[e.name] : null;
  if(f){
    h += "<details><summary>動きを見る（フォームの要点）</summary><div class='formbox'>"
      + "<p><b>開始：</b>"+esc(f.s)+"</p><p><b>終了：</b>"+esc(f.e)+"</p><ul>"
      + f.c.map(c=>"<li>"+esc(c)+"</li>").join("") + "</ul>"
      + '<p class="muted small">痛みやしびれがあれば中止してください。機種により形が異なります。実機の表示とスタッフの説明を優先してください。</p></div></details>';
  }
  h += '<div class="subacts">'
    + '<button onclick="moveLater('+i+')">あとで行う ↓</button>'
    + '<button onclick="skipEx('+i+')">今日は見送る</button>'
    + '<button onclick="toggleSub('+i+')">代替する</button></div>';
  h += '<div id="sub'+i+'" style="display:none;margin-top:8px"><label class="small muted">代替種目を選んでください（今のメニューと重複する種目は除いています）</label>'
    + '<select class="subsel" id="subsel'+i+'">' + CATALOG.filter(n=>!S.draft.exercises.some(x=>x.name===n)).map(n=>'<option value="'+esc(n)+'">'+esc(n)+"</option>").join("") + "</select>"
    + '<button class="btn sub sm" style="margin-top:8px" onclick="applySub('+i+')">この種目に置き換える</button></div>';
  h += "</div></div>";
  return h;
}
function toggleEx(i){ openEx = (openEx===i? -1 : i); render(); }
function toggleSub(i){ const el = document.getElementById("sub"+i); if(el) el.style.display = el.style.display==="none"? "block":"none"; }

function setVal(i,j,field,val){ const s = S.draft.exercises[i].sets[j]; s[field] = val===""? "" : Math.max(0, parseFloat(val)||0); save(); }
function stepVal(i,j,field,delta){
  const s = S.draft.exercises[i].sets[j];
  let v = parseFloat(s[field]); if(isNaN(v)) v = 0;
  v = Math.max(0, Math.round((v+delta)*10)/10);
  s[field] = v; save(); render();
}
function addSet(i){
  const e = S.draft.exercises[i];
  const last = e.sets[e.sets.length-1];
  e.sets.push({ kg: last? last.kg : "", reps: last? last.reps : "", done:false });
  save(); render(); toast("セットを追加しました");
}
function removeSet(i){
  const e = S.draft.exercises[i];
  if(e.sets.length<=1){ toast("これ以上減らせません"); return; }
  if(e.sets[e.sets.length-1].done){ toast("完了したセットは、先に「戻す」で取り消してください"); return; }
  e.sets.pop(); save(); render();
}
function setMemo(i,val){ S.draft.exercises[i].memo = val; save(); }
function setRir(i,val){ S.draft.exercises[i].rir = val; save(); }
function setMachine(i,val){ S.draft.exercises[i].machine = val; save(); }
function defaultRepsFor(name){
  for(const mid of ORDER){ for(const stg of [1,2,3]){ for(const it of MENUS[mid].menus[stg]){ if(it[0]===name) return it[3]; } } }
  return "8–12";
}
function fillFromLast(i){
  const e = S.draft.exercises[i]; if(!e.lastSets) return;
  e.sets.forEach((s,j)=>{ if(!s.done){ const ls = e.lastSets[Math.min(j, e.lastSets.length-1)]; s.kg = ls.kg??""; s.reps = ls.reps??""; } });
  save(); render(); toast("前回の値を入れました");
}
function completeSet(i,j){
  const e = S.draft.exercises[i], s = e.sets[j];
  if(s.kg==="" && s.reps===""){ toast("重量か回数を入れてください"); return; }
  s.done = true; lastAction = {ex:i, set:j};
  save();
  const p = draftProgress();
  if(p.done < p.total){
    startRest();
    const exDone = e.sets.every(x=>x.done);
    if(exDone){ const nxt = S.draft.exercises.findIndex((x,idx)=>idx>i && x.status!=="skipped" && x.sets.some(y=>!y.done)); if(nxt>=0) openEx = nxt; }
  } else { stopTimer(); toast("全セット完了。お疲れさまでした"); }
  render();
  const el = document.getElementById("ex"+openEx); if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function undoSet(i,j){ S.draft.exercises[i].sets[j].done = false; if(lastAction && lastAction.ex===i && lastAction.set===j) lastAction = null; save(); render(); }
function undoLast(){ if(!lastAction) return; S.draft.exercises[lastAction.ex].sets[lastAction.set].done = false; lastAction = null; save(); render(); }
function moveLater(i){
  const arr = S.draft.exercises; const [e] = arr.splice(i,1); arr.push(e);
  openEx = arr.length-1; save(); render(); toast("最後に回しました");
}
function skipEx(i){ S.draft.exercises[i].status = "skipped"; const nxt = S.draft.exercises.findIndex((x,idx)=>idx>i && x.status!=="skipped"); openEx = nxt; save(); render(); }
function unskipEx(i){ S.draft.exercises[i].status = "active"; openEx = i; save(); render(); }
function applySub(i){
  const sel = document.getElementById("subsel"+i); if(!sel) return;
  const name = sel.value, e = S.draft.exercises[i];
  e.substitutedFrom = e.substitutedFrom || e.name;
  e.name = name; e.equip = equipOf(name); e.reps = defaultRepsFor(name);
  const last = lastRecord(name);
  e.lastDate = last? last.date : null; e.lastSets = last? last.sets : null; e.lastMemo = last? last.memo : "";
  save(); render(); toast(name+" に置き換えました");
}

/* ===== 休憩タイマー ===== */
function startRest(){
  if(!S.draft) return;
  S.draft.timerEnd = Date.now() + S.settings.rest*1000;
  save(); updateTimerBar();
}
function stopTimer(){ if(S.draft){ S.draft.timerEnd = 0; save(); } document.body.classList.remove("timer-on"); }
function updateTimerBar(){
  const end = S.draft && S.draft.timerEnd;
  if(end && end > Date.now()){ document.body.classList.add("timer-on"); tickTimer(); }
  else document.body.classList.remove("timer-on");
}
function tickTimer(){
  const end = S.draft && S.draft.timerEnd;
  const el = document.getElementById("timerText");
  if(!end){ document.body.classList.remove("timer-on"); return; }
  const rest = Math.max(0, Math.round((end - Date.now())/1000));
  if(el) el.textContent = Math.floor(rest/60)+":"+pad(rest%60);
  if(rest<=0){
    stopTimer();
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    toast("休憩おわり。次のセットへ");
    render();
  }
}
setInterval(tickTimer, 500);
document.getElementById("timerAdd").addEventListener("click", ()=>{ if(S.draft && S.draft.timerEnd){ S.draft.timerEnd += 30000; save(); tickTimer(); } });
document.getElementById("timerEnd").addEventListener("click", ()=>{ stopTimer(); render(); });

/* ===== 終了フロー ===== */
function openFinish(){
  const d = S.draft, p = draftProgress();
  const mins = Math.max(1, Math.round((Date.now()-d.startedAt)/60000));
  openSheet("<h2>"+esc(d.menuLabel || MENUS[d.menuId].label)+" を記録します</h2>"
    + '<div class="kv"><span>完了したセット</span><b>'+p.done+" / "+p.total+"</b></div>"
    + '<div class="kv"><span>所要時間</span><span>約'+mins+"分</span></div>"
    + '<p class="muted small">任意：今日の有酸素・ストレッチ（分）</p>'
    + '<div class="num2"><label>ランニング（分）<input type="number" inputmode="numeric" id="finRun" placeholder="15"></label>'
    + '<label>ストレッチ（分）<input type="number" inputmode="numeric" id="finStretch" placeholder="10"></label></div>'
    + '<button class="btn" style="margin-top:14px" onclick="doFinish()">記録して終了する</button>'
    + '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">戻る</button>');
}
function doFinish(){
  const d = S.draft, p = draftProgress();
  const run = parseInt(document.getElementById("finRun").value,10);
  const stretch = parseInt(document.getElementById("finStretch").value,10);
  const exercises = [];
  const skippedNames = [];
  for(const e of d.exercises){
    if(e.status==="skipped"){ skippedNames.push(e.name); continue; }
    const doneSets = e.sets.filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps}));
    if(doneSets.length || e.memo) exercises.push({ name:e.name, equip:e.equip, sets:doneSets, memo:e.memo||"", substitutedFrom:e.substitutedFrom||null, rir:(e.rir!=null? e.rir : ""), machine:e.machine||"" });
  }
  const allDone = p.total>0 && p.done===p.total;
  S.history.unshift({
    id: uid(), date: todayStr(), menuId: d.menuId, menuLabel: d.menuLabel || MENUS[d.menuId].label, stage: d.stage,
    startedAt: d.startedAt, finishedAt: Date.now(),
    durationMin: Math.max(1, Math.round((Date.now()-d.startedAt)/60000)),
    status: allDone? "完了":"終了", exercises, skippedNames,
    cardio: { run: isNaN(run)? null: run, stretch: isNaN(stretch)? null: stretch }
  });
  S.draft = null; inWorkout = false; lastAction = null; stopTimer();
  save(); closeSheet(); tab = "today"; render(); window.scrollTo(0,0);
  toast("記録しました。お疲れさまでした");
}

/* ===== 履歴 ===== */
const PART_GROUP = { "chest":["胸","#ef4444"], "back":["背中","#3b82f6"], "shoulder":["肩","#f59e0b"], "biceps":["腕","#a855f7"], "triceps":["腕","#a855f7"], "abs":["腹","#06b6d4"], "quads":["脚","#22c55e"], "glutes":["脚","#22c55e"], "hams":["脚","#22c55e"], "calves":["脚","#22c55e"] };
const GROUP_LEGEND = [["胸","#ef4444"],["背中","#3b82f6"],["肩","#f59e0b"],["腕","#a855f7"],["腹","#06b6d4"],["脚","#22c55e"]];
function histCalHTML(){
  const now = new Date();
  const base = histMonth? new Date(histMonth + "-02T00:00:00") : new Date(now.getFullYear(), now.getMonth(), 2);
  const y = base.getFullYear(), m = base.getMonth();
  const startDow = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const trained = {};
  const dayGroups = {};
  for(const s of S.history){
    trained[s.date] = true;
    const arr = dayGroups[s.date] || (dayGroups[s.date] = []);
    for(const e of (s.exercises || [])){
      const g = PART_GROUP[PART_OF[e.name]];
      if(g && !arr.some(x => x[0] === g[0])) arr.push(g);
    }
  }
  const todayStr = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
  let cells = "";
  for(let i = 0; i < startDow; i++) cells += '<span class="cal-cell"></span>';
  for(let d = 1; d <= days; d++){
    const ds = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const cls = "cal-cell" + (trained[ds]? " on" : "") + (ds === todayStr? " today" : "") + (histDay === ds? " sel" : "");
    const dots = (dayGroups[ds] || []).slice(0, 4).map(g => '<i style="background:' + g[1] + '"></i>').join("");
    cells += '<button class="' + cls + '" onclick="pickHistDay(\'' + ds + '\')">' + d + (dots? '<span class="cal-dots">' + dots + "</span>" : "") + "</button>";
  }
  const dows = ["日","月","火","水","木","金","土"].map(d => '<span class="cal-dow">' + d + "</span>").join("");
  const legend = GROUP_LEGEND.map(g => '<span><i style="background:' + g[1] + '"></i>' + g[0] + "</span>").join("");
  return '<div class="cal-wrap"><div class="cal-head"><button class="cal-nav" onclick="moveHistMonth(-1)">‹</button><b>' + y + "年" + (m + 1) + '月</b><button class="cal-nav" onclick="moveHistMonth(1)">›</button></div>'
    + '<div class="cal-grid dow">' + dows + '</div><div class="cal-grid">' + cells + "</div>"
    + '<div class="cal-legend">' + legend + "</div>"
    + (histDay? '<p class="small" style="margin:8px 0 0">' + fmtDay(histDay) + ' の記録を表示中 <button class="btn ghost sm" onclick="pickHistDay(null)">すべて表示</button></p>'
              : '<p class="muted small" style="margin:8px 0 0">日の下の色は、その日に鍛えた部位です。タップするとその日の記録だけを表示します。</p>')
    + "</div>";
}
function moveHistMonth(delta){
  const now = new Date();
  const base = histMonth? new Date(histMonth + "-02T00:00:00") : new Date(now.getFullYear(), now.getMonth(), 2);
  base.setMonth(base.getMonth() + delta);
  histMonth = base.getFullYear() + "-" + String(base.getMonth() + 1).padStart(2, "0");
  render();
}

let exHistOpen = null;

function weekStart(d){ const x = new Date(d); const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function weekSessions(){
  const ws = weekStart(new Date());
  return S.history.filter(s=>{ const d = new Date((s.date||"")+"T00:00:00"); return !isNaN(d) && d >= ws; });
}
function est1RM(kg, reps){
  const w = parseFloat(kg), r = parseFloat(reps);
  if(isNaN(w) || isNaN(r) || w<=0 || r<=0) return null;
  return Math.round(w*(1+r/30)*10)/10;
}

/* ===== バックアップ ===== */
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function exportJSON(){
  const data = { app:"PowerBear", kind:"v8-backup", version:1, exportedAt:new Date().toISOString(),
    data:{ settings:S.settings, history:S.history } };
  downloadJSON("power_bear_v8_backup_" + todayStr().replace(/-/g,"") + ".json", data);
  S.settings.lastExportAt = new Date().toISOString(); save(); render();
  toast("バックアップを保存しました");
}
function toNum(v){ const n = parseFloat(v); return isNaN(n)? "" : n; }
function extractV6History(parsed){
  if(!parsed || typeof parsed!=="object") return null;
  if(Array.isArray(parsed.history)) return parsed.history;
  if(parsed.state && Array.isArray(parsed.state.history)) return parsed.state.history;
  if(parsed.data && Array.isArray(parsed.data.history)) return parsed.data.history;
  if(parsed.app && Array.isArray(parsed.app.history)) return parsed.app.history;
  return null;
}
function v6LocalExists(){
  try{ return !!(localStorage.getItem("power_bear_production_v1") || localStorage.getItem("powerBearReentryV1")); }catch(e){ return false; }
}
function v7LocalExists(){
  try{ return !!localStorage.getItem("power_bear_v7"); }catch(e){ return false; }
}
function importLocalV7(){
  let parsed = null;
  try{ const raw = localStorage.getItem("power_bear_v7"); if(raw) parsed = JSON.parse(raw); }catch(e){}
  if(!parsed || !Array.isArray(parsed.history)){ toast("この端末にV7の記録が見つかりませんでした"); return; }
  const seen = new Set(S.history.map(function(x){ return x.date+"|"+x.menuLabel+"|"+(x.exercises||[]).length; }));
  const add = parsed.history.filter(function(x){ return x && Array.isArray(x.exercises) && !seen.has(x.date+"|"+x.menuLabel+"|"+x.exercises.length); });
  if(!add.length){ toast("V7の記録は取り込み済みです"); return; }
  S.history = add.concat(S.history).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
  save(); render();
  toast("V7の記録を "+add.length+" 件取り込みました");
}
function importLocalV6(){
  let parsed = null;
  try{
    const raw = localStorage.getItem("power_bear_production_v1") || localStorage.getItem("powerBearReentryV1");
    if(raw) parsed = JSON.parse(raw);
  }catch(e){}
  const hist = extractV6History(parsed);
  if(!hist){ toast("この端末にV6の記録が見つかりませんでした"); return; }
  const mapped = mapV6History(hist);
  if(!mapped.length){ toast("取り込める記録がありませんでした"); return; }
  const seen = new Set(S.history.map(x=>x.date+"|"+x.menuLabel+"|"+(x.exercises||[]).length));
  const add = mapped.filter(x=>!seen.has(x.date+"|"+x.menuLabel+"|"+x.exercises.length));
  if(!add.length){ toast("V6の記録は取り込み済みです"); return; }
  S.history = add.concat(S.history).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  save(); render();
  toast("V6の記録を "+add.length+" 件取り込みました");
}
function mapV6History(hist){
  const blockMap = ["上半身A","下半身A","上半身B","下半身B"];
  const out = [];
  for(const rec of hist){
    if(!rec || !Array.isArray(rec.exercises)) continue;
    const exercises = [];
    for(const e of rec.exercises){
      if(!e || e.deleted) continue;
      const sets = (Array.isArray(e.sets)? e.sets:[]).filter(s=>s && typeof s==="object" && s.completed!==false)
        .map(s=>({ kg: toNum(s.load!=null? s.load : (s.kg!=null? s.kg : s.weight)), reps: toNum(s.reps) }))
        .filter(s=>s.kg!=="" || s.reps!=="");
      const name = e.name || e.title || e.label || "種目";
      if(sets.length) exercises.push({ name, equip: equipOf(name), sets, memo: e.memo || e.note || "", substitutedFrom:null });
    }
    if(!exercises.length) continue;
    let label = "旧記録";
    const b = rec.reentryMeta && rec.reentryMeta.block;
    if(Number.isInteger(b) && blockMap[b]) label = blockMap[b];
    else if(rec.label) label = String(rec.label);
    out.push({ id: uid()+out.length, date: String(rec.date||"").slice(0,10) || "----", menuId:null, menuLabel: label,
      stage:0, startedAt: Date.parse(rec.date)||0, finishedAt: Date.parse(rec.date)||0, durationMin:null,
      status:"旧記録", legacy:true, exercises, skippedNames:[], cardio:{run:null, stretch:null} });
  }
  return out;
}
function importJSON(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(obj && obj.app==="PowerBear" && (obj.kind==="v7-backup" || obj.kind==="v8-backup") && obj.data){
        if(!confirm("このバックアップで復元しますか。今の記録は置き換わります。（置き換える前に、今の記録もファイルに保存します）")) return;
        downloadJSON("power_bear_v8_before_restore_" + todayStr().replace(/-/g,"") + ".json",
          { app:"PowerBear", kind:"v8-backup", version:1, exportedAt:new Date().toISOString(), data:{ settings:S.settings, history:S.history } });
        S.settings = obj.data.settings || S.settings;
        S.history = Array.isArray(obj.data.history)? obj.data.history : [];
        S.draft = null; inWorkout = false;
        save(); render(); toast("復元しました");
        return;
      }
      if(obj && obj.localStorage && typeof obj.localStorage==="object"){
        const raw = obj.localStorage["power_bear_production_v1"] || obj.localStorage["powerBearReentryV1"];
        if(!raw) throw new Error("no-key");
        const parsed = typeof raw==="string"? JSON.parse(raw) : raw;
        const v6hist = extractV6History(parsed);
        if(!v6hist) throw new Error("empty");
        const mapped = mapV6History(v6hist);
        if(!mapped.length) throw new Error("empty");
        const seen = new Set(S.history.map(x=>x.date+"|"+x.menuLabel+"|"+(x.exercises||[]).length));
        const add = mapped.filter(x=>!seen.has(x.date+"|"+x.menuLabel+"|"+x.exercises.length));
        S.history = add.concat(S.history).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
        save(); render();
        toast(add.length? "旧アプリの記録を "+add.length+" 件追加しました" : "追加できる新しい旧記録はありませんでした");
        return;
      }
      throw new Error("format");
    }catch(e){
      toast("読み込めませんでした。Power Bear のバックアップファイルを選んでください");
    }
    input.value = "";
  };
  reader.readAsText(file);
}

/* ===== 初期化 ===== */
render();
if(S.draft && S.draft.timerEnd && S.draft.timerEnd > Date.now()) updateTimerBar();
</script>
